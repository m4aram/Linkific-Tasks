name: shoplite
description: "ShopLite - a small, production-ready Flutter product catalogue."
publish_to: 'none'

# versionName+versionCode. Bump the part after "+" for EVERY store upload.
version: 1.0.0+1

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1       # state management
  dio: ^5.4.3                    # HTTP client
  flutter_secure_storage: ^9.2.2 # encrypted storage for the auth token
  cached_network_image: ^3.4.1   # disk + memory image cache
  sqflite: ^2.3.3                # local SQLite database (favourites)
  path: ^1.9.0
  flutter_svg: ^2.0.10           # vector illustrations

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/

name: flutter_package_explorer
description: A practical Flutter package learning project covering GetX, Freezed, GoRouter, Dio, Hive and utility packages.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  get: ^4.7.2
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  go_router: ^18.0.2
  dio: ^5.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  intl: ^0.20.2
  url_launcher: ^6.3.2
  share_plus: ^13.3.1
  connectivity_plus: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.1
  freezed: ^4.0.2
  json_serializable: ^6.11.0
  go_router_builder: ^4.5.0

flutter:
  uses-material-design: true
